[project]
name = "agent-formulaire-gchat"
version = "0.1.0"
description = "Agent conversationnel générique de remplissage de formulaire sur Google Chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.19.0",
    "google-auth>=2.36.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    # Base de connaissances (synchronisation Drive -> Supabase, app/kb)
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

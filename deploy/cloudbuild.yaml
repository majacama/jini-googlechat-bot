steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/agent-formulaire-gchat/app:$COMMIT_SHA
      - -f
      - deploy/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/agent-formulaire-gchat/app:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agent-formulaire-gchat
      - --image
      - europe-west1-docker.pkg.dev/$PROJECT_ID/agent-formulaire-gchat/app:$COMMIT_SHA
      - --region
      - europe-west1
      - --allow-unauthenticated
      - --min-instances
      - "0"
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/agent-formulaire-gchat/app:$COMMIT_SHA
